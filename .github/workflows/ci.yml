name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests, lint
        run: ./gradlew build --continue
      - name: Upload Room schemas (commit any new version to core/database/schemas)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: android/core/database/schemas
          if-no-files-found: ignore

  demo-images:
    # Checks every demo Unsplash photo URL from GitHub's network (the dev sandbox can't reach Unsplash).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-demo-images.sh

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
