name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests, lint
        run: ./gradlew build --continue
      - name: Upload Room schemas (commit any new version to core/database/schemas)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: android/core/database/schemas
          if-no-files-found: ignore

  catalog-images:
    # Checks every catalog photo URL from GitHub's network and publishes a labelled contact sheet
    # to the `ci-image-review` branch for visual verification of image relevance.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq imagemagick jq > /dev/null
      - run: ./scripts/check-catalog-images.sh
      - name: Publish contact sheet
        if: always() && github.ref == 'refs/heads/main'
        run: |
          cd out && rm -rf thumbs-keep && git init -q -b ci-image-review && git add -A
          git -c user.name=tripwise-ci -c user.email=ci@users.noreply.github.com commit -qm "Catalog images for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-image-review

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
