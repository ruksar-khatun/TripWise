name: Installable APK

# Builds the TripWise APK you can install straight on a phone, checks it on an emulator with NO backend
# (StandaloneTourTest: guest mode, bundled catalog, on-device itinerary, budget estimate) and publishes
# TripWise.apk plus screenshots to the `ci-apk` branch.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Standalone check on emulator (no backend running)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          working-directory: android
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher || true
            adb install -r -g app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class com.tripwise.app.StandaloneTourTest com.tripwise.app.debug.test/androidx.test.runner.AndroidJUnitRunner | tee ../standalone-result.txt
            grep -q "OK (1 test)" ../standalone-result.txt || echo "STANDALONE_FAILED=1" >> $GITHUB_ENV
            mkdir -p ../shots && adb pull /sdcard/Android/data/com.tripwise.app.debug/files/tour/. ../shots/ || true

      - name: Publish APK to ci-apk branch
        if: always()
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/TripWise.apk
          cp -r shots out/ 2>/dev/null || true
          cp standalone-result.txt out/ 2>/dev/null || true
          cd out
          git init -q -b ci-apk
          git add -A
          git -c user.name=tripwise-ci -c user.email=ci@users.noreply.github.com commit -qm "APK for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-apk

      - name: Fail if the standalone check failed
        if: env.STANDALONE_FAILED == '1'
        run: exit 1
